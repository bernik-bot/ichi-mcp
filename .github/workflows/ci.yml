name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        mcp: ["mcp>=1.2,<2", "mcp>=2"]
    name: py${{ matrix.python }} / ${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "${{ matrix.mcp }}"
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Import
        run: python -c "from ichi_mcp.server import mcp, main; print('ok')"
      - name: Tests (HTTP mocked)
        run: pytest -q
