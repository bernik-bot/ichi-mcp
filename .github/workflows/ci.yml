name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        # the declared floor, the newest 1.x and 2.x
        mcp: ["mcp==1.23.0", "mcp>=1.23,<2", "mcp>=2"]
    name: py${{ matrix.python }} / ${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "${{ matrix.mcp }}"
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Import
        run: python -c "from ichi_mcp.server import mcp, main; print('ok')"
      - name: Tests (HTTP mocked)
        run: pytest -q

  docker:
    # what Glama does: build the image, start the server over stdio, and list its tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: docker build -t ichi-mcp .
      - name: Introspect over stdio (initialize + tools/list)
        run: |
          python -m pip install "mcp>=1.23"
          python examples/introspect.py docker run -i --rm ichi-mcp
